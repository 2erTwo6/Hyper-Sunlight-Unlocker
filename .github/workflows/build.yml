name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 缓存签名 keystore：保证每次 CI 构建用同一把钥匙签名，
      # 用户才能直接覆盖安装新版本（否则需先卸载）。
      - name: Cache signing keystore
        uses: actions/cache@v4
        with:
          path: signing.keystore
          key: signing-keystore-v1

      - name: Set version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          # v1.2.3 -> 10203（versionCode 必须随版本递增）
          CODE=$(echo "$TAG" | sed -E 's/^v//' | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: ./build.sh
        env:
          SUNLIGHT_VERSION_NAME: ${{ steps.version.outputs.name }}
          SUNLIGHT_VERSION_CODE: ${{ steps.version.outputs.code }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SunlightBoostLSP-apk
          path: SunlightBoostLSP.apk
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SunlightBoostLSP.apk
          generate_release_notes: true
